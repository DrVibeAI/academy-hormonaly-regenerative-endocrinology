  summary:
    en: Designed toward future CME accreditation, this post-graduate clinical course prepares aesthetic and dermatologic clinicians to appraise the endocrine physiology of skin, differentiate pathognomonic endocrine cutaneous signs from isolated cosmetic presentations, evaluate the GRADE evidence and pharmacodynamics of cutaneous peptides and incretin therapies, and navigate regulatory and liability boundaries without promoting unapproved dosing protocols or commercial bias.
