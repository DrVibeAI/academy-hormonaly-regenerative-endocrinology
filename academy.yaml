  faq:
    - q:
        en: Does the course give doses or protocols?
        es-MX: "¿El curso proporciona dosis o protocolos?"
        ar-AE: هل تقدم الدورة جرعات أو بروتوكولات؟
        ckb-IQ: ئایا خولەکە ژەمەدەرمان یان پرۆتۆکۆڵ دەستنیشان دەکات؟
      a:
        en: No. It teaches the evidence, the regulatory status and what each role can safely do next. Dosing and
          product sourcing are excluded by design.
        es-MX: "No. Enseña la evidencia, el estado regulatorio y lo que cada función puede hacer de forma segura a continuación. La dosificación y la obtención de productos están excluidas por diseño."
        ar-AE: كلا. إنها تشرح الأدلة، والوضع التنظيمي، وما يمكن لكل دور مهني القيام به بأمان كخطوة تالية. وتُستثنى
          الجرعات وتوريد المنتجات عن قصد وبشكل أساسي.
        ckb-IQ: نەخێر. خولەکە فێری بەڵگەکان، پێگەی ڕێکاری و ئەوەت دەکات کە هەر ڕۆڵێک دەتوانێت دواتر بە سەلامەتی چی
          بکات. ژەمەدەرمان و دابینکردنی بەرهەمەکان بە مەبەست بەدەرکراون.
    - q:
        en: Which countries does it cover?
        es-MX: "¿Qué países abarca?"
        ar-AE: ما هي الدول التي تغطيها الدورة؟
        ckb-IQ: چ وڵاتانێک دەگرێتەوە؟
      a:
        en: The United States, the United Kingdom, the European Union, Portugal, Brazil and the United Arab Emirates.
          Each statement names its country and date, and your own country comes first.
        es-MX: "Estados Unidos, el Reino Unido, la Unión Europea, Portugal, Brasil y los Emiratos Árabes Unidos. Cada afirmación identifica su país y fecha, y tu propio país aparece primero."
        ar-AE: الولايات المتحدة، والمملكة المتحدة، والاتحاد الأوروبي، والبرتغال، والبرازيل، والإمارات العربية المتحدة.
          تحدد كل عبارة بلدها وتاريخها، ويأتي بلدك أولاً.
        ckb-IQ: ویلایەتە یەکگرتووەکان، شانشینی یەکگرتوو، یەکێتیی ئەورووپا، پورتوگال، بەڕازیل و ئیماراتی یەکگرتووی
          عەرەبی. هەر ڕاگەیەندراوێک ناوی وڵات و بەروارەکەی لەسەرە، و وڵاتەکەی خۆت لە پێشەوە دێت.
    - q:
        en: Is there CME or CE credit?
        es-MX: "¿Hay créditos CME o CE?"
        ar-AE: هل تمنح الدورة ساعات معتمدة للتعليم الطبي المستمر (CME) أو التعليم المستمر (CE)؟
        ckb-IQ: ئایا خاڵی CME یان CEی لەگەڵدایە؟
      a:
        en: This is a Hormonaly Academy certificate of completion, with GCLS AI Academy as education partner. CME or
          CE credit is not offered at this time.
        es-MX: "Esta es una constancia de finalización de Hormonaly Academy, con GCLS AI Academy como socio educativo. No se otorgan créditos CME ni CE en este momento."
        ar-AE: النسخة العربية قيد المراجعة، ولم يُعتمد لها رصيد تعليم طبي أو مهني مستمر.
        ckb-IQ: ئەمە بڕوانامەی تەواوکردنی Hormonaly Academyـیە، بە هاوبەشیی پەروەردەیی لەگەڵ GCLS AI Academy. لە
          ئێستادا خاڵی CME یان CE پێشکەش ناکرێت.
    - q:
        en: What do I get at the end?
        es-MX: "¿Qué obtengo al terminar?"
        ar-AE: ما الذي سأحصل عليه عند إتمام الدورة؟
        ckb-IQ: لە کۆتاییدا چیم دەستدەکەوێت؟
      a:
        en: Complete all seven modules and pass the final check with 80% or more to receive your Hormonaly Academy
          certificate of completion, including during the free enrollment period through November 30. Each
          certificate has a public verification code.
        es-MX: "Completa los siete módulos y aprueba la comprobación final con 80% o más para recibir tu constancia de finalización de Hormonaly Academy, también durante el periodo de inscripción gratuita hasta el 30 de noviembre. Cada constancia tiene un código público de verificación."
        ar-AE: أكمل الوحدات السبع واجتز التقييم النهائي بنسبة 80% أو أكثر لتحصل على شهادة إتمام من أكاديمية Hormonaly،
          بما في ذلك خلال فترة التسجيل المجاني حتى 30 نوفمبر. تحمل كل شهادة رمز تحقق متاحًا للعامة.
        ckb-IQ: هەر حەوت یەکە تەواو بکە و لە تاقیکردنەوەی کۆتاییدا 80% یان زیاتر بەدەستبهێنە بۆ وەرگرتنی بڕوانامەی
          تەواوکردنی Hormonaly Academy، بە ماوەی ناونووسینی بێبەرامبەریشەوە تا 30ی تشرینی دووەم. هەر
