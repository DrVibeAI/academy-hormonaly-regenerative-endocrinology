    - q: { en: "Which countries does it cover?" }
      a: { en: "The United States, the United Kingdom, the European Union, Portugal, Brazil and the United Arab Emirates. Each statement names its country and date, and your own country comes first." }
    - q: { en: "Is there CME or CE credit?" }
