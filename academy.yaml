# Academy catalog — Hormonaly Academy at hormonaly.perceptors.ai: the home for Hormonaly's peptide-based courses (Omar, 2026-09-25).
# Hormones and Peptides for Skin is the first; further peptide courses join this catalog (runtime multi-course support pending).
academy: hormonaly
brand:
  voices:                       # stock library voice (no faculty likeness/voice without a release); intake video brief: "voice: library"
    es-MX: { voice_id: "", name: "" }
    en: { voice_id: "Xb7hH8MSUJpSbSDYk0k2", name: "Alice — Clear, Engaging Educator (ElevenLabs library)" }   # narration on demand + tutor voice
  name: Hormonaly Academy
  shortName: Hormonaly
  wordmarkSuffix: ACADEMY              # typographic wordmark (no logo asset yet): "Hormonaly" in the display serif + mono suffix
  logo: ./assets/hormonaly-logo.png     # INTAKE: logo asset pending from customer — until it ships in public/, the wordmark renders
  theme: perceptors-house               # design tier 0: the Perceptors house theme verbatim (design.md), Omar 2026-09-24
  designTier: 0
  accent: "#5A4BC4"                     # Perceptors violet (house); palette and fonts are inherited from the house, not copied
  tagline: { en: "Hormones and peptides, evidence-graded." }   # academy-level: every course in the catalog sits under it
  supportEmail: support@hormonaly.ai    # placeholder — confirm with customer
  issuer: Hormonaly Academy
# Academy homepage (public, before sign-in) — Perceptors house design (design.md tier 0, perceptor-foundry docs/brand.md).
# The course list, numbers and audiences come from the catalog packages at build time; only the words below are written here.
# No accreditation or credit claim appears unless the package records it (runtime gate).
home:
  kicker: { en: "Hormonaly Academy · for clinicians" }
  headline: { en: "Hormones and peptides, evidence‑graded." }   # non-breaking hyphen keeps "evidence-graded" on one line
  lede: { en: "Short courses for clinicians who are asked about hormone and peptide treatments for skin, hair and ageing. Every statement is graded and traced to its source, and a physician reviews every course before it opens." }
  primaryAction: { en: "Start learning" }
  secondaryAction: { en: "See the courses" }
  coursesTitle: { en: "Courses" }
  coursesNote: { en: "More peptide courses are in preparation." }
  steps:
    - title: { en: "Learn in short moments" }
      body: { en: "Each module is a run of moments of a few minutes each, with exercises and a check at the end. Your place is saved on any device." }
    - title: { en: "See the grade behind every claim" }
      body: { en: "Mechanism, human evidence, regulatory status and open questions are kept apart, and each claim carries its evidence grade and its sources." }
    - title: { en: "Practice guidance for your role" }
      body: { en: "Prescribers, clinical staff and advisers get the same evidence; what to do next adapts to your scope of practice." }
    - title: { en: "Ask the course" }
      body: { en: "A tutor answers from the course and its sources only, and says so when the course does not cover your question." }
  evidence:
    title: { en: "How the evidence is checked" }
    body: { en: "Sources are read and graded before a course is written. An automated check then matches each cited statement to a passage in its source, and a physician reviews the whole course, including the quiz and the tutor's answers, before it opens. Dosing is excluded by design." }
  reviewers:
    - name: "Dr. Fady Hannah-Shmouni, MD FRCPC"
      role: { en: "Medical review · author of the Hormonaly pocket guides on aesthetic and regenerative endocrinology and on peptides" }
  faq:
    - q: { en: "Does the course give doses or protocols?" }
      a: { en: "No. It teaches the evidence, the regulatory status and what each role can safely do next. Dosing and product sourcing are excluded by design." }
    - q: { en: "Which countries does the regulatory content cover?" }
      a: { en: "The United States and the United Kingdom, each labelled and dated. Other countries are not covered." }
    - q: { en: "Is there CME or CE credit?" }
      a: { en: "Not yet. The course is designed toward future CME accreditation, and no credit is offered at this time." }
    - q: { en: "What do I get at the end?" }
      a: { en: "Pass the final check with 80% or more to receive a certificate of completion with a public verification code." }
  ctaTitle: { en: "Start with the first module." }
  disclaimer: { en: "Educational content for licensed clinicians. It does not replace clinical judgement, specialist input or formal guidelines." }

catalog:
  # The academy's first catalog entry is the course the runtime serves. The 2026-09-02 intake placeholder
  # (packages/aesthetic-regenerative-endocrinology.json, never authored) was removed 2026-09-24 so the catalog gate passes;
  # re-add it when that package exists.
  - course: packages/hormones-peptides-skin.json          # Hormones and Peptides for Skin
    audience: { en: "Physicians, nurse practitioners and physician associates, nurses and other licensed providers" }
    blurb: { en: "The hormones and peptides your patients ask about for skin, hair and the ageing face: what is shown in people, what is only mechanism, and what the rules allow in the US, the UK, the EU, Portugal, Brazil and the UAE." }
    status: draft
    series: regenerative-endocrinology
    order: 1
    entitlement: { type: open }         # open enrolment; pricing/entitlement to confirm with Hormonaly
    certificate: { access: included }
modules: { fieldbook: true, promptLab: false, webinars: false, blog: false, peers: false, achievements: false }
