    title:
      en: Terms and Conditions
      es-MX: "Términos y condiciones"
      ar: الشروط والأحكام
      ckb-IQ: مەرج و ڕێساکان
    sections:
      - title:
          en: Using Perceptors and your academy
          es-MX: "Uso de Perceptors y tu academia"
          ar: استخدام Perceptors وأكاديميتك
          ckb-IQ: بەکارهێنانی Perceptors و ئەکادیمیاکەت
        paragraphs:
          - en: Perceptors is a learning platform from GCLS AI Lab. These terms cover use of the Perceptors website and
              platform. Your course provider is identified on its academy page; additional enrollment or
              institutional terms may apply to that course. Contact support@perceptors.ai for access,
              certificate or terms questions.
            es-MX: "Perceptors es una plataforma de aprendizaje de GCLS AI Lab. Estos términos abarcan el uso del sitio web y la plataforma Perceptors. El proveedor de tu curso se identifica en la página de su academia; pueden aplicarse términos adicionales de inscripción o de la institución a ese curso. Contacta a support@perceptors.ai si tienes preguntas sobre acceso, constancias o términos."
            ar: Perceptors منصة تعليمية تابعة لـ GCLS AI Lab. تسري هذه الشروط على استخدام موقع Perceptors ومنصتها. تُعرّف
              صفحة الأكاديمية الجهة المقدمة لدورتك؛ وقد تسري على الدورة شروط إضافية للتسجيل أو شروط مؤسسية.
              للاستفسارات المتعلقة بالدخول أو الشهادات أو الشروط، تواصل عبر support@perceptors.ai.
            ckb-IQ: پلاتفۆرمی Perceptors پلاتفۆرمێکی فێربوونە لەلایەن GCLS AI Lab. ئەم مەرجانە بەکارهێنانی ماڵپەڕ و
              پلاتفۆرمی Perceptors دەگرنەوە. دابینکەری خولەکەت لەسەر پەڕەی ئەکادیمیاکەی دەستنیشان کراوە؛ ڕەنگە
              مەرجی زیاتری ناونووسین یان دامەزراوەیی بۆ ئەو خولە پێڕەو بکرێت. بۆ پرسیارەکانی دەستپێڕاگەیشتن،
              بڕوانامە یان مەرجەکان پەیوەندی بکە بە support@perceptors.ai.
      - title:
          en: Your account
          es-MX: "Tu cuenta"
          ar: حسابك
          ckb-IQ: هەژمارەکەت
        paragraphs:
          - en: Use accurate account details and keep your sign-in credentials private. Each learner account is personal.
              Use courses within your qualifications and the requirements of your institution and
              jurisdiction. Report suspected unauthorized access to support.
            es-MX: "Usa datos de cuenta correctos y mantén privadas tus credenciales de inicio de sesión. Cada cuenta de participante es personal. Usa los cursos dentro de tus cualificaciones y los requisitos de tu institución y jurisdicción. Informa a soporte si sospechas un acceso no autorizado."
            ar: استخدم بيانات حساب دقيقة واحتفظ ببيانات تسجيل الدخول بسرية. كل حساب متعلم شخصي. استخدم الدورات ضمن حدود
              مؤهلاتك ومتطلبات مؤسستك والجهات المختصة في نطاق ممارستك. أبلغ الدعم عن أي اشتباه في دخول غير
              مصرح به.
            ckb-IQ: زانیاریی دروستی هەژمارەکەت بەکاربهێنە و زانیارییەکانی چوونەژوورەوەت بە نهێنی بهێڵەرەوە. هەژماری هەر
              فێرخوازێک کەسییە. خولەکان لە چوارچێوەی لێهاتووییەکانی خۆت و داواکارییەکانی دامەزراوەکەت و
              دەسەڵاتی دادوەریی خۆت بەکاربهێنە. لە ئەگەری گومانکردن لە دەستپێڕاگەیشتنی ڕێپێنەدراو، ئاگاداری
              بەشی پشتگیری بکەرەوە.
      - title:
          en: Education and AI tools
          es-MX: "Educación y herramientas de IA"
          ar: التعليم وأدوات الذكاء الاصطناعي
          ckb-IQ: پەروەردە و ئامرازەکانی زیرەکیی دەستکرد
        paragraphs:
          - en: Course materials and AI responses support learning. They do not provide individual medical advice,
              professional licensure or a substitute for qualified clinical judgment. AI responses may contain
              errors. Check sources and applicable professional guidance before applying course information.
            es-MX: "Los materiales del curso y las respuestas de IA apoyan el aprendizaje. No proporcionan asesoría médica individual ni una licencia profesional, y no sustituyen el juicio clínico cualificado. Las respuestas de IA pueden contener errores. Consulta las fuentes y la orientación profesional aplicable antes de aplicar la información del curso."
            ar: تدعم مواد الدورة وإجابات الذكاء الاصطناعي التعلم. ولا تقدم مشورة طبية فردية أو ترخيصاً مهنياً، ولا تحل محل
              التقدير السريري المؤهل. قد تتضمن إجابات الذكاء الاصطناعي أخطاء. تحقق من المصادر والإرشادات
              المهنية المعمول بها قبل تطبيق معلومات الدورة.
            ckb-IQ: کەرەستەکانی خولەکە و وەڵامەکانی زیرەکیی دەستکرد پشتگیری لە فێربوون دەکەن. ئەوان ئامۆژگاریی پزیشکیی
              تاکەکەسی، مۆڵەتی پیشەیی یان جێگرەوەیەک بۆ بڕیاردانی کلینیکیی لێهاتوو دابین ناکەن. وەڵامەکانی
              زیرەکیی دەستکرد ڕەنگە هەڵەیان تێدابێت. پێش جێبەجێکردنی زانیارییەکانی خولەکە، سەرچاوەکان و
              ڕێنماییە پیشەییە پێوەندیدارەکان بپشکنە.
          - en: Do not submit patient records, identifiable health information, confidential employer material or
              information you do not have permission to use. Use fictional examples for practice.
            es-MX: "No envíes expedientes de pacientes, información de salud identificable, material confidencial de tu empleador ni información que no tengas permiso de usar. Usa ejemplos ficticios para practicar."
            ar: لا تُدخل سجلات مرضى أو معلومات صحية تكشف الهوية أو مواد سرية تخص جهة العمل أو معلومات لا تملك إذناً
              باستخدامها. استخدم أمثلة افتراضية في التمارين.
            ckb-IQ: تۆماری نەخۆش، زانیاریی تەندروستیی ناسێنەر، کەرەستەی نهێنیی خاوەنکار یان ئەو زانیارییانەی مۆڵەتی
              بەکارهێنانیانت نییە نەنێریت. بۆ ڕاهێنان نموونەی خەیاڵی بەکاربهێنە.
      - title:
          en: Course creators’ views and independent content
          es-MX: "Opiniones de los creadores de cursos y contenido independiente"
          ar: آراء منشئي الدورات والمحتوى المستقل
          ckb-IQ: بۆچوونی دروستکەرانی خول و ناوەڕۆکی سەربەخۆ
        paragraphs:
          - en: The views, interpretations, opinions and recommendations expressed in a course are those of its identified
              creators, instructors and contributors. They do not necessarily reflect the views of, or
              constitute endorsement by, Perceptors.ai, DrVibe Inc., GCLS AI Lab or their affiliates. Course
              creators are responsible for the substance of the teaching content they contribute, including
              the evidence and professional positions they present.
            es-MX: "Las perspectivas, interpretaciones, opiniones y recomendaciones expresadas en un curso pertenecen a sus creadores, instructores y colaboradores identificados. No reflejan necesariamente las opiniones de Perceptors.ai, DrVibe Inc., GCLS AI Lab o sus afiliadas, ni constituyen su respaldo. Los creadores de los cursos son responsables del contenido sustantivo de la enseñanza que aportan, incluidas la evidencia y las posturas profesionales que presentan."
            ar: الآراء والتفسيرات ووجهات النظر والتوصيات الواردة في الدورة تخص منشئيها ومدرّسيها والمساهمين المحددين فيها.
              وهي لا تعكس بالضرورة آراء Perceptors.ai أو DrVibe Inc. أو GCLS AI Lab أو الجهات التابعة لها، ولا
              تشكل تأييداً منها. يتحمل منشئو الدورات مسؤولية مضمون المحتوى التعليمي الذي يقدمونه، بما في ذلك
              الأدلة والمواقف المهنية التي يعرضونها.
            ckb-IQ: بۆچوونەکان، لێکدانەوەکان، ڕاکان و پێشنیازە دەربڕاوەکان لە هەر خولێکدا هی دروستکەران، مامۆستایان و
              بەشداربووانی دەستنیشانکراوی خولەکەن. مەرج نییە ڕەنگدانەوەی بۆچوونی Perceptors.ai، DrVibe Inc.،
              GCLS AI Lab یان لقەکانیان بن، یان وەک پشتڕاستکردنەوە لەلایەن ئەوانەوە هەژمار بکرێن. دروستکەرانی
              خول بەرپرسن لە جەوهەری ناوەڕۆکی فێرکاری کە پێشکەشی دەکەن، لەوانەش بەڵگەکان و هەڵوێستە پیشەییەکان
              کە دەیخەنە ڕوو.
          - en: Courses may discuss emerging, investigational, controversial or off-label approaches, or practices that
              differ from established clinical guidelines. Making a course available through the platform does
              not mean that Perceptors.ai, DrVibe Inc., GCLS AI Lab or their affiliates recommend those
              approaches, consider them guideline-concordant, or authorize their clinical use. Platform
              delivery does not give these entities control over every statement, opinion or interpretation
              made by a course creator.
            es-MX: "Los cursos pueden abordar enfoques emergentes, en investigación, controvertidos o fuera de indicación, o prácticas que difieren de las guías clínicas establecidas. Ofrecer un curso a través de la plataforma no significa que Perceptors.ai, DrVibe Inc., GCLS AI Lab o sus afiliadas recomienden esos enfoques, los consideren concordantes con las guías o autoricen su uso clínico. La distribución mediante la plataforma no otorga a estas entidades control sobre cada afirmación, opinión o interpretación de un creador de cursos."
            ar: قد تناقش الدورات أساليب ناشئة أو قيد البحث أو مثيرة للجدل أو استخدامات خارج الاستطبابات المعتمدة، أو
              ممارسات تختلف عن الإرشادات السريرية الراسخة. إتاحة دورة عبر المنصة لا تعني أن Perceptors.ai أو
              DrVibe Inc. أو GCLS AI Lab أو الجهات التابعة لها توصي بهذه الأساليب، أو تعدّها متوافقة مع
              الإرشادات، أو تجيز استخدامها سريرياً. تقديم الدورة عبر المنصة لا يمنح هذه الجهات السيطرة على كل
              عبارة أو رأي أو تفسير يصدر عن منشئ الدورة.
            ckb-IQ: خولەکان ڕەنگە باس لە شێوازە تازەپێگەیشتووەکان، لێکۆڵینەوەییەکان، جێی مشتومڕەکان یان بەکارهێنانی
              دەرەوەی ڕێنمایی (off-label)، یان ئەو کارانە بکەن کە جیاوازن لە ڕێنماییە کلینیکییە جێگیرکراوەکان.
              خستنەبەردەستی خولێک لە ڕێگەی پلاتفۆرمەکەوە بەو مانایە نییە کە Perceptors.ai، DrVibe Inc.، GCLS
              AI Lab یان لقەکانیان پێشنیازی ئەو شێوازانە دەکەن، بە هاوتای ڕێنماییەکانیان دەزانن، یان ڕێگە بە
              بەکارهێنانی کلینیکییان دەدەن. گەیاندنی پلاتفۆرم کۆنترۆڵ بەسەر هەموو لێدوان، بۆچوون یان
              لێکدانەوەیەک کە لەلایەن دروستکەری خولەکەوە دەکرێت بەم قەوارانە نادات.
          - en: Learners must independently assess the evidence, applicable guidelines, regulatory requirements and their
              professional scope before applying information in practice. Educational content does not replace
              individual clinical judgment or patient-specific evaluation. This clause does not exclude any
              duty, liability or consumer right that cannot lawfully be excluded, or change the
              responsibilities of an entity that is itself identified as the creator or provider of particular
              content.
            es-MX: "Los participantes deben evaluar de forma independiente la evidencia, las guías aplicables, los requisitos regulatorios y su ámbito profesional antes de aplicar la información en la práctica. El contenido educativo no sustituye el juicio clínico individual ni la evaluación específica del paciente. Esta cláusula no excluye ninguna obligación, responsabilidad o derecho del consumidor que no pueda excluirse lícitamente, ni cambia las responsabilidades de una entidad que se identifique como creadora o proveedora de un contenido determinado."
            ar: على المتعلمين تقييم الأدلة والإرشادات المعمول بها والمتطلبات التنظيمية وحدود نطاقهم المهني بصورة مستقلة
              قبل تطبيق المعلومات عملياً. لا يحل المحتوى التعليمي محل التقدير السريري الفردي أو التقييم الخاص
              بكل مريض. لا يستبعد هذا البند أي واجب أو مسؤولية أو حق للمستهلك لا يجوز استبعاده قانوناً، ولا
              يغيّر مسؤوليات أي جهة تُعرّف هي نفسها بوصفها منشئ محتوى معين أو مقدمه.
            ckb-IQ: پێویستە فێرخوازان بە شێوەیەکی سەربەخۆ هەڵسەنگاندن بۆ بەڵگەکان، ڕێنماییە پێوەندیدارەکان، داواکارییە
              ڕێکخارییەکان و مەودای پیشەییی خۆیان بکەن پێش ئەوەی زانیارییەکان لە کاردا جێبەجێ بکەن. ناوەڕۆکی
              فێرکاری جێگەی بڕیاردانی کلینیکیی تاکەکەسی یان هەڵسەنگاندنی تایبەت بە نەخۆش ناگرێتەوە. ئەم بڕگەیە
              هیچ ئەرک، بەرپرسیارێتی یان مافێکی بەکاربەر کە ناتوانرێت بە شێوەیەکی یاسایی بەدەر بکرێت لانابات،
              یان بەرپرسیارێتییەکانی ئەو لایەنە ناگۆڕێت کە خۆی وەک دروستکەر یان دابینکەری ناوەڕۆکێکی دیاریکراو
              دەستنیشان کراوە.
        id: course-creators-views
      - title:
          en: Enrollment and payment
          es-MX: "Inscripción y pago"
          ar: التسجيل والدفع
          ckb-IQ: ناونووسین و پارەدان
        paragraphs:
          - en: The course page and checkout describe the price, currency, access period and included services. A free
              enrollment does not create a paid subscription. Contact support about billing errors,
              cancellation or refunds. Nothing in these terms removes mandatory consumer rights.
            es-MX: "La página del curso y el proceso de pago describen el precio, la moneda, el periodo de acceso y los servicios incluidos. Una inscripción gratuita no crea una suscripción de pago. Contacta a soporte sobre errores de facturación, cancelaciones o reembolsos. Nada en estos términos elimina derechos obligatorios del consumidor."
            ar: توضح صفحة الدورة وصفحة الدفع السعر والعملة ومدة الإتاحة والخدمات المشمولة. لا ينشئ التسجيل المجاني
              اشتراكاً مدفوعاً. تواصل مع الدعم بشأن أخطاء الفوترة أو الإلغاء أو استرداد المبالغ. لا تلغي هذه
              الشروط أي حقوق إلزامية للمستهلك.
            ckb-IQ: پەڕەی خول و بەشی پارەدان نرخ، دراو، ماوەی دەستپێڕاگەیشتن و خزمەتگوزارییە لەخۆگیراوەکان ڕوون دەکەنەوە.
              ناونووسینی بێبەرامبەر بەشداریکردنی بەپارە دروست ناکات. سەبارەت بە هەڵەکانی پارەدان،
              هەڵوەشاندنەوە یان گەڕاندنەوەی پارە، پەیوەندی بە بەشی پشتگیرییەوە بکە. هیچ شتێک لەم مەرجانەدا
              مافە ناچارییەکانی بەکاربەر لانابات.
      - title:
          en: Assessments and certificates
          es-MX: "Evaluaciones y constancias"
          ar: التقييمات والشهادات
          ckb-IQ: هەڵسەنگاندنەکان و بڕوانامەکان
        paragraphs:
          - en: Complete assessments honestly and meet the course’s stated requirements. A certificate records completion
              under the named issuer’s rules. GCLS AI Lab branding identifies platform or learning support; it
              does not establish GCLS accreditation, CME or CE credit. Formal accreditation or credit applies
              only when explicitly confirmed for the specific course.
            es-MX: "Completa las evaluaciones con honestidad y cumple los requisitos establecidos del curso. Una constancia registra la finalización conforme a las reglas del emisor identificado. La marca GCLS AI Lab identifica el apoyo de la plataforma o al aprendizaje; no establece acreditación de GCLS ni créditos CME o CE. La acreditación formal o los créditos solo aplican cuando se confirman explícitamente para el curso específico."
            ar: أكمل التقييمات بأمانة واستوفِ متطلبات الدورة المعلنة. تسجل الشهادة الإتمام وفق قواعد الجهة المُصدرة
              المسماة. تشير علامة GCLS AI Lab إلى دعم المنصة أو التعلم؛ ولا تثبت اعتماد GCLS أو رصيداً للتعليم
              الطبي أو المهني المستمر (CME أو CE). لا يسري اعتماد رسمي أو رصيد إلا عند تأكيده صراحة للدورة
              المعنية.
            ckb-IQ: هەڵسەنگاندنەکان بە دەستپاکی تەواو بکە و مەرجە دیاریکراوەکانی خولەکە جێبەجێ بکە. بڕوانامە تەواوکردن
              لەژێر یاساکانی دەرکەری ناوبراودا تۆمار دەکات. براندکردنی GCLS AI Lab دەستنیشانی پلاتفۆرم یان
              پشتگیریی فێربوون دەکات؛ ئەمە دانپێدانانی فەرمیی GCLS، متمانەپێدانی CME یان CE دانامەزرێنێت.
              باوەڕپێکردنی فەرمی یان متمانە تەنها کاتێک پێڕەو دەکرێت کە بە ڕوونی بۆ خولە دیاریکراوەکە
              پشتڕاستکرابێتەوە.
      - title:
          en: Materials and acceptable use
          es-MX: "Materiales y uso aceptable"
          ar: المواد والاستخدام المقبول
          ckb-IQ: کەرەستەکان و بەکارهێنانی پەسەندکراو
        paragraphs:
          - en: Use learning materials for your personal or authorized institutional learning. Do not redistribute, sell
              or publish them without the rights holder’s permission, except where law permits. Do not bypass
              enrollment, assessments or access controls, access other users’ data, or disrupt the service.
              Access restrictions can be raised with support for review.
            es-MX: "Usa los materiales de aprendizaje para tu aprendizaje personal o institucional autorizado. No los redistribuyas, vendas ni publiques sin permiso del titular de los derechos, salvo donde la ley lo permita. No eludas la inscripción, las evaluaciones ni los controles de acceso, no accedas a los datos de otros usuarios ni interrumpas el servicio. Puedes plantear las restricciones de acceso a soporte para su revisión."
            ar: استخدم المواد التعليمية لتعلمك الشخصي أو للتعلم المؤسسي المصرح به. لا تعِد توزيعها أو بيعها أو نشرها دون
              إذن صاحب الحقوق، إلا حيث يسمح القانون. لا تتجاوز التسجيل أو التقييمات أو ضوابط الوصول، ولا تصل
              إلى بيانات مستخدمين آخرين أو تعطل الخدمة. يمكن عرض القيود على الوصول على الدعم لمراجعتها.
            ckb-IQ: کەرەستەکانی فێربوون بۆ فێربوونی کەسی یان دامەزراوەیی ڕێپێدراوی خۆت بەکاربهێنە. دووبارە دابەشیان
              مەکەرەوە، مەیانفرۆشە و بڵاویان مەکەرەوە بەبێ مۆڵەتی خاوەنی مافەکان، مەگەر یاسا ڕێگەی پێدابێت.
              بەربەستەکانی ناونووسین، هەڵسەنگاندنەکان یان کۆنترۆڵی دەستپێڕاگەیشتن مەبەزێنە، دەست بۆ داتای
              بەکارهێنەرانی تر مەبە، و خزمەتگوزارییەکە تێک مەدە. دەکرێت سنووردارکردنەکانی دەستپێڕاگەیشتن بۆ
              پێداچوونەوە لەگەڵ بەشی پشتگیری باس بکرێن.
      - title:
          en: Availability and external services
          es-MX: "Disponibilidad y servicios externos"
          ar: الإتاحة والخدمات الخارجية
          ckb-IQ: بەردەستبوون و خزمەتگوزارییە دەرەکییەکان
        paragraphs:
          - en: Courses and platform features may be maintained or updated. Availability can be interrupted. External
              resources are governed by their providers’ terms. Retain your own copies of permitted personal
              learning artifacts where needed.
            es-MX: "Los cursos y las funciones de la plataforma pueden recibir mantenimiento o actualizaciones. La disponibilidad puede interrumpirse. Los recursos externos se rigen por los términos de sus proveedores. Conserva tus propias copias de los materiales personales de aprendizaje permitidos cuando sea necesario."
            ar: قد تخضع الدورات وخصائص المنصة للصيانة أو التحديث، وقد تنقطع الإتاحة. تخضع الموارد الخارجية لشروط مقدميها.
              احتفظ عند الحاجة بنسخك الخاصة من مخرجات تعلمك الشخصية المسموح بالاحتفاظ بها.
            ckb-IQ: خولەکان و تایبەتمەندییەکانی پلاتفۆرم ڕەنگە چاکسازییان بۆ بکرێت یان نوێ بکرێنەوە. دەکرێت بەردەستبوون
              پچڕانی تێبکەوێت. سەرچاوە دەرەکییەکان لەلایەن مەرجەکانی دابینکەرەکانیانەوە بەڕێوەدەبرێن. لە کاتی
              پێویستدا، کۆپیی تایبەت بە خۆت لە بەرهەمە فێربوونییە کەسییە ڕێپێدراوەکانت بپارێزە.
      - title:
          en: Your agreement and changes
          es-MX: "Tu aceptación y los cambios"
          ar: موافقتك والتغييرات
          ckb-IQ: ڕێککەوتن و گۆڕانکارییەکانی تۆ
        paragraphs:
          - en: The displayed version identifies these terms. When requested after sign-in, your typed name and
              affirmative checkbox record your electronic acceptance. Acceptance is saved to your account for
              the applicable academy and course. A changed document will require renewed acceptance.
            es-MX: "La versión mostrada identifica estos términos. Cuando se solicite después de iniciar sesión, el nombre que escribas y la casilla que marques afirmativamente registran tu aceptación electrónica. La aceptación se guarda en tu cuenta para la academia y el curso correspondientes. Un documento modificado requerirá una nueva aceptación."
            ar: يحدد رقم الإصدار المعروض هذه الشروط. عند طلب الموافقة بعد تسجيل الدخول، يسجل اسمك المكتوب واختيارك
              الإيجابي لمربع الموافقة قبولك الإلكتروني. تُحفظ الموافقة في حسابك للأكاديمية والدورة المعنيتين.
              يتطلب تغيير الوثيقة تجديد الموافقة.
            ckb-IQ: وەشانە نیشاندراوەکە ئەم مەرجانە دەستنیشان دەکات. کاتێک دوای چوونەژوورەوە داواکرا، ناوی نووسراوت و
              چوارگۆشەی دیاریکردنی ئەرێنی، قبووڵکردنی ئەلیکترۆنیی تۆ تۆمار دەکەن. قبووڵکردن لە هەژمارەکەتدا بۆ
              ئەکادیمیا و خولی پێوەندیدار پاشەکەوت دەکرێت. بەڵگەنامەیەکی گۆڕاو پێویستی بە قبووڵکردنەوەی نوێ
              دەبێت.
          - en: Accepting these terms is separate from marketing consent and optional tutor-memory preferences. The
              Privacy Policy explains how platform information is handled. Contact support@perceptors.ai about
              either document.
            es-MX: "La aceptación de estos términos es independiente del consentimiento para publicidad y de las preferencias opcionales de memoria del tutor. La Política de privacidad explica cómo se maneja la información de la plataforma. Contacta a support@perceptors.ai sobre cualquiera de estos documentos."
            ar: قبول هذه الشروط منفصل عن الموافقة على التسويق وتفضيلات ذاكرة المدرّس الاختيارية. توضح سياسة الخصوصية كيفية
              التعامل مع معلومات المنصة. للاستفسار عن أي من الوثيقتين، تواصل عبر support@perceptors.ai.
            ckb-IQ: قبووڵکردنی ئەم مەرجانە جیاوازە لە ڕەزامەندیی بەبازاڕکردن و پەسەندکراوە ئارەزوومەندانەکانی بیرگەی
              ڕاهێنەر. سیاسەتی پاراستنی نهێنی ڕوونی دەکاتەوە کە چۆن زانیارییەکانی پلاتفۆرم مامەڵەیان لەگەڵ
              دەکرێت. سەبارەت بە هەر بەڵگەنامەیەک پەیوەندی بە support@perceptors.ai بکە.
    sourceVersion: 2026-10-03-v2
