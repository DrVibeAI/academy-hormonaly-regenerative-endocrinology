  privacy:
    version: 2026-10-03-v1-ar-review-20261007
    updated: October 3, 2026
    title:
      en: Privacy Policy
      ar: سياسة الخصوصية
    sections:
      - title:
          en: Who to contact
          ar: جهة التواصل
        paragraphs:
          - en: Perceptors, a GCLS AI Lab platform, supports the academy provider identified
              on your course page. Contact support@perceptors.ai about privacy
              or account requests and identify the academy you use. Our contact
              location is Dubai, United Arab Emirates. Your academy or
              institution may provide an additional privacy notice for its own
              processing.
            ar: تدعم Perceptors، وهي منصة تابعة لـ GCLS AI Lab، الجهة المقدمة للأكاديمية
              المحددة في صفحة دورتك. لطلبات الخصوصية أو الحساب، تواصل عبر
              support@perceptors.ai وحدد الأكاديمية التي تستخدمها. موقع التواصل
              لدينا هو دبي، الإمارات العربية المتحدة. قد تقدم أكاديميتك أو
              مؤسستك إشعار خصوصية إضافياً يتعلق بمعالجتها الخاصة للبيانات.
      - title:
          en: Account, inquiry and learning information
          ar: معلومات الحساب والاستفسارات والتعلم
        paragraphs:
          - en: We process the information you provide in contact forms, including your
              name, email, organization and message, to respond to your inquiry.
              Learner accounts use identity and sign-in information, course
              enrollment, learning progress, assessment submissions and results
              to provide and administer learning.
            ar: نعالج المعلومات التي تقدمها في نماذج التواصل، ومنها اسمك وبريدك الإلكتروني
              ومؤسستك ورسالتك، للرد على استفسارك. تستخدم حسابات المتعلمين
              معلومات الهوية وتسجيل الدخول والتسجيل في الدورات والتقدم التعليمي
              وإجابات التقييمات ونتائجها لتوفير التعلم وإدارته.
          - en: Where agreement is required, we retain the name you type, your account and
              academy/course identifiers, document version and snapshot,
              language and server-recorded acceptance time. This records what
              you agreed to.
            ar: عندما تكون الموافقة مطلوبة، نحتفظ بالاسم الذي تكتبه ومعرّفات حسابك
              والأكاديمية والدورة وإصدار الوثيقة ونسخة منها واللغة ووقت الموافقة
              المسجل على الخادم. يوثق ذلك ما وافقت عليه.
      - title:
          en: AI-assisted learning
          ar: التعلم بمساعدة الذكاء الاصطناعي
        paragraphs:
          - en: Questions, responses and learning context are processed to provide tutor
              features and feedback. Optional remembered preferences use the
              controls described in the course. Do not enter patient
              information, sensitive health details or confidential information.
              AI providers may process the information needed to deliver the
              requested feature.
            ar: تُعالج الأسئلة والإجابات وسياق التعلم لتوفير خصائص المدرّس والتغذية الراجعة.
              تُدار التفضيلات المحفوظة الاختيارية عبر الضوابط الموضحة في الدورة.
              لا تُدخل معلومات المرضى أو تفاصيل صحية حساسة أو معلومات سرية. قد
              يعالج مقدمو خدمات الذكاء الاصطناعي المعلومات اللازمة لتقديم
              الخاصية المطلوبة.
      - title:
          en: Service providers and recipients
          ar: مقدمو الخدمات والجهات المتلقية
        paragraphs:
          - en: Providers of hosting, authentication, email, payment and AI services process
              information needed for those services. Academy administrators and
              authorized faculty may access learning records needed to
              administer the course, support learners and review assessments.
              Payment details are handled by the payment provider; the platform
              uses transaction and enrollment records to manage access.
            ar: يعالج مقدمو خدمات الاستضافة والمصادقة والبريد الإلكتروني والدفع والذكاء
              الاصطناعي المعلومات اللازمة لتلك الخدمات. قد يطلع مسؤولو
              الأكاديمية وأعضاء هيئة التدريس المصرح لهم على سجلات التعلم اللازمة
              لإدارة الدورة ودعم المتعلمين ومراجعة التقييمات. يتولى مقدم خدمة
              الدفع معالجة بيانات الدفع؛ وتستخدم المنصة سجلات المعاملات والتسجيل
              لإدارة الوصول.
          - en: Public certificate verification can disclose the learner name, course,
              issuer, date and certificate status to someone with the
              verification link or code. Avoid sharing that link if you do not
              want to make those details available.
            ar: قد يكشف التحقق العام من الشهادات اسم المتعلم والدورة والجهة المُصدرة
              والتاريخ وحالة الشهادة لمن يملك رابط التحقق أو رمزه. تجنب مشاركة
              الرابط إذا كنت لا ترغب في إتاحة تلك التفاصيل.
      - title:
          en: Storage, international processing and security
          ar: التخزين والمعالجة الدولية والأمان
        paragraphs:
          - en: Services may process information in different countries depending on the
              academy’s hosting and provider arrangements. Institutional hosting
              and data requirements are set with the relevant provider; do not
              assume a particular country of storage from a contact address.
            ar: قد تعالج الخدمات المعلومات في دول مختلفة بحسب ترتيبات استضافة الأكاديمية
              ومقدمي خدماتها. تُحدد متطلبات الاستضافة والبيانات المؤسسية مع مقدم
              الخدمة المعني؛ فلا تفترض دولة معينة للتخزين استناداً إلى عنوان
              التواصل.
          - en: Access controls and operational safeguards support protection of
              information. No service can guarantee absolute security. We retain
              information as needed to provide learning, document certificates
              and agreements, resolve issues and meet applicable obligations.
              Retention depends on record type and academy arrangements.
            ar: تسهم ضوابط الوصول والتدابير التشغيلية في حماية المعلومات. لا تستطيع أي خدمة
              ضمان الأمان المطلق. نحتفظ بالمعلومات بقدر الحاجة لتوفير التعلم
              وتوثيق الشهادات والاتفاقات ومعالجة المشكلات والوفاء بالالتزامات
              المعمول بها. تعتمد مدة الاحتفاظ على نوع السجل وترتيبات الأكاديمية.
      - title:
          en: Cookies and device storage
          ar: ملفات تعريف الارتباط وتخزين الجهاز
        paragraphs:
          - en: Sign-in and learning features use browser storage to keep your session,
              language and learning state. The public website may collect usage
              events through its configured analytics service. Browser controls
              can clear or restrict local storage; doing so can affect sign-in
              and unsynchronized learning progress.
            ar: تستخدم خصائص تسجيل الدخول والتعلم تخزين المتصفح للاحتفاظ بجلستك ولغتك وحالة
              تعلمك. قد يجمع الموقع العام أحداث الاستخدام عبر خدمة التحليلات
              المعدّة له. تتيح إعدادات المتصفح مسح التخزين المحلي أو تقييده؛ وقد
              يؤثر ذلك في تسجيل الدخول والتقدم التعليمي غير المتزامن.
      - title:
          en: Your choices and requests
          ar: خياراتك وطلباتك
        paragraphs:
          - en: You can use available account and tutor controls and contact support to
              request access, correction or deletion of personal information.
              Rights and exceptions depend on applicable law and the role of
              your academy or institution. We may need to verify your identity
              before acting. Do not send identity documents or sensitive records
              unless requested through an appropriate process.
            ar: يمكنك استخدام ضوابط الحساب والمدرّس المتاحة والتواصل مع الدعم لطلب الوصول
              إلى معلوماتك الشخصية أو تصحيحها أو حذفها. تعتمد الحقوق
              والاستثناءات على القانون المعمول به ودور أكاديميتك أو مؤسستك. قد
              نحتاج إلى التحقق من هويتك قبل تنفيذ الطلب. لا ترسل وثائق هوية أو
              سجلات حساسة إلا إذا طُلبت منك ضمن إجراء مناسب.
          - en: Terms acceptance does not sign you up for marketing. Optional communications
              and optional tutor preferences are managed separately.
            ar: لا يؤدي قبول الشروط إلى اشتراكك في التسويق. تُدار المراسلات الاختيارية
              وتفضيلات المدرّس الاختيارية بصورة منفصلة.
      - title:
          en: Policy updates
          ar: تحديثات السياسة
        paragraphs:
          - en: The displayed version and date identify this policy. Material changes are
              reflected in an updated notice. Where the learner agreement is
              presented again, it identifies the revised documents.
            ar: يحدد الإصدار والتاريخ المعروضان هذه السياسة. تنعكس التغييرات الجوهرية في
              إشعار محدّث. وعند عرض اتفاق المتعلم مجدداً، فإنه يحدد الوثائق
              المعدلة.
