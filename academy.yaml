              support@perceptors.ai for access, certificate or terms questions.
            ar: Perceptors منصة تعليمية تابعة لـ GCLS AI Lab. تسري هذه الشروط على استخدام
              موقع Perceptors ومنصتها. تُعرّف صفحة الأكاديمية الجهة المقدمة
              لدورتك؛ وقد تسري على الدورة شروط إضافية للتسجيل أو شروط مؤسسية.
              للاستفسارات المتعلقة بالدخول أو الشهادات أو الشروط، تواصل عبر
              support@perceptors.ai.
      - title:
          en: Your account
          ar: حسابك
        paragraphs:
          - en: Use accurate account details and keep your sign-in credentials private. Each
              learner account is personal. Use courses within your
              qualifications and the requirements of your institution and
              jurisdiction. Report suspected unauthorized access to support.
            ar: استخدم بيانات حساب دقيقة واحتفظ ببيانات تسجيل الدخول بسرية. كل حساب متعلم
              شخصي. استخدم الدورات ضمن حدود مؤهلاتك ومتطلبات مؤسستك والجهات
              المختصة في نطاق ممارستك. أبلغ الدعم عن أي اشتباه في دخول غير مصرح
              به.
      - title:
          en: Education and AI tools
          ar: التعليم وأدوات الذكاء الاصطناعي
        paragraphs:
          - en: Course materials and AI responses support learning. They do not provide
              individual medical advice, professional licensure or a substitute
              for qualified clinical judgment. AI responses may contain errors.
              Check sources and applicable professional guidance before applying
              course information.
            ar: تدعم مواد الدورة وإجابات الذكاء الاصطناعي التعلم. ولا تقدم مشورة طبية فردية
              أو ترخيصاً مهنياً، ولا تحل محل التقدير السريري المؤهل. قد تتضمن
              إجابات الذكاء الاصطناعي أخطاء. تحقق من المصادر والإرشادات المهنية
              المعمول بها قبل تطبيق معلومات الدورة.
          - en: Do not submit patient records, identifiable health information, confidential
              employer material or information you do not have permission to
              use. Use fictional examples for practice.
            ar: لا تُدخل سجلات مرضى أو معلومات صحية تكشف الهوية أو مواد سرية تخص جهة العمل
              أو معلومات لا تملك إذناً باستخدامها. استخدم أمثلة افتراضية في
              التمارين.
      - title:
          en: Course creators’ views and independent content
          ar: آراء منشئي الدورات والمحتوى المستقل
        paragraphs:
          - en: The views, interpretations, opinions and recommendations expressed in a
              course are those of its identified creators, instructors and
              contributors. They do not necessarily reflect the views of, or
              constitute endorsement by, Perceptors.ai, DrVibe Inc., GCLS AI Lab
              or their affiliates. Course creators are responsible for the
              substance of the teaching content they contribute, including the
              evidence and professional positions they present.
            ar: الآراء والتفسيرات ووجهات النظر والتوصيات الواردة في الدورة تخص منشئيها
              ومدرّسيها والمساهمين المحددين فيها. وهي لا تعكس بالضرورة آراء
              Perceptors.ai أو DrVibe Inc. أو GCLS AI Lab أو الجهات التابعة لها،
              ولا تشكل تأييداً منها. يتحمل منشئو الدورات مسؤولية مضمون المحتوى
              التعليمي الذي يقدمونه، بما في ذلك الأدلة والمواقف المهنية التي
              يعرضونها.
          - en: Courses may discuss emerging, investigational, controversial or off-label
              approaches, or practices that differ from established clinical
              guidelines. Making a course available through the platform does
              not mean that Perceptors.ai, DrVibe Inc., GCLS AI Lab or their
              affiliates recommend those approaches, consider them
              guideline-concordant, or authorize their clinical use. Platform
              delivery does not give these entities control over every
              statement, opinion or interpretation made by a course creator.
            ar: قد تناقش الدورات أساليب ناشئة أو قيد البحث أو مثيرة للجدل أو استخدامات خارج
              الاستطبابات المعتمدة، أو ممارسات تختلف عن الإرشادات السريرية
              الراسخة. إتاحة دورة عبر المنصة لا تعني أن Perceptors.ai أو DrVibe
              Inc. أو GCLS AI Lab أو الجهات التابعة لها توصي بهذه الأساليب، أو
              تعدّها متوافقة مع الإرشادات، أو تجيز استخدامها سريرياً. تقديم
              الدورة عبر المنصة لا يمنح هذه الجهات السيطرة على كل عبارة أو رأي
              أو تفسير يصدر عن منشئ الدورة.
          - en: Learners must independently assess the evidence, applicable guidelines,
              regulatory requirements and their professional scope before
              applying information in practice. Educational content does not
              replace individual clinical judgment or patient-specific
              evaluation. This clause does not exclude any duty, liability or
              consumer right that cannot lawfully be excluded, or change the
              responsibilities of an entity that is itself identified as the
              creator or provider of particular content.
            ar: على المتعلمين تقييم الأدلة والإرشادات المعمول بها والمتطلبات التنظيمية وحدود
              نطاقهم المهني بصورة مستقلة قبل تطبيق المعلومات عملياً. لا يحل
              المحتوى التعليمي محل التقدير السريري الفردي أو التقييم الخاص بكل
              مريض. لا يستبعد هذا البند أي واجب أو مسؤولية أو حق للمستهلك لا
              يجوز استبعاده قانوناً، ولا يغيّر مسؤوليات أي جهة تُعرّف هي نفسها
              بوصفها منشئ محتوى معين أو مقدمه.
        id: course-creators-views
      - title:
          en: Enrollment and payment
          ar: التسجيل والدفع
        paragraphs:
          - en: The course page and checkout describe the price, currency, access period and
              included services. A free enrollment does not create a paid
              subscription. Contact support about billing errors, cancellation
              or refunds. Nothing in these terms removes mandatory consumer
              rights.
            ar: توضح صفحة الدورة وصفحة الدفع السعر والعملة ومدة الإتاحة والخدمات المشمولة.
              لا ينشئ التسجيل المجاني اشتراكاً مدفوعاً. تواصل مع الدعم بشأن
              أخطاء الفوترة أو الإلغاء أو استرداد المبالغ. لا تلغي هذه الشروط أي
              حقوق إلزامية للمستهلك.
      - title:
          en: Assessments and certificates
          ar: التقييمات والشهادات
        paragraphs:
          - en: Complete assessments honestly and meet the course’s stated requirements. A
              certificate records completion under the named issuer’s rules.
              GCLS AI Lab branding identifies platform or learning support; it
              does not establish GCLS accreditation, CME or CE credit. Formal
              accreditation or credit applies only when explicitly confirmed for
              the specific course.
            ar: أكمل التقييمات بأمانة واستوفِ متطلبات الدورة المعلنة. تسجل الشهادة الإتمام
              وفق قواعد الجهة المُصدرة المسماة. تشير علامة GCLS AI Lab إلى دعم
              المنصة أو التعلم؛ ولا تثبت اعتماد GCLS أو رصيداً للتعليم الطبي أو
              المهني المستمر (CME أو CE). لا يسري اعتماد رسمي أو رصيد إلا عند
              تأكيده صراحة للدورة المعنية.
      - title:
          en: Materials and acceptable use
          ar: المواد والاستخدام المقبول
        paragraphs:
          - en: Use learning materials for your personal or authorized institutional
              learning. Do not redistribute, sell or publish them without the
              rights holder’s permission, except where law permits. Do not
              bypass enrollment, assessments or access controls, access other
              users’ data, or disrupt the service. Access restrictions can be
              raised with support for review.
            ar: استخدم المواد التعليمية لتعلمك الشخصي أو للتعلم المؤسسي المصرح به. لا تعِد
              توزيعها أو بيعها أو نشرها دون إذن صاحب الحقوق، إلا حيث يسمح
              القانون. لا تتجاوز التسجيل أو التقييمات أو ضوابط الوصول، ولا تصل
              إلى بيانات مستخدمين آخرين أو تعطل الخدمة. يمكن عرض القيود على
              الوصول على الدعم لمراجعتها.
      - title:
          en: Availability and external services
          ar: الإتاحة والخدمات الخارجية
        paragraphs:
          - en: Courses and platform features may be maintained or updated. Availability can
              be interrupted. External resources are governed by their
              providers’ terms. Retain your own copies of permitted personal
              learning artifacts where needed.
            ar: قد تخضع الدورات وخصائص المنصة للصيانة أو التحديث، وقد تنقطع الإتاحة. تخضع
              الموارد الخارجية لشروط مقدميها. احتفظ عند الحاجة بنسخك الخاصة من
              مخرجات تعلمك الشخصية المسموح بالاحتفاظ بها.
      - title:
          en: Your agreement and changes
          ar: موافقتك والتغييرات
        paragraphs:
          - en: The displayed version identifies these terms. When requested after sign-in,
              your typed name and affirmative checkbox record your electronic
              acceptance. Acceptance is saved to your account for the applicable
              academy and course. A changed document will require renewed
              acceptance.
            ar: يحدد رقم الإصدار المعروض هذه الشروط. عند طلب الموافقة بعد تسجيل الدخول، يسجل
              اسمك المكتوب واختيارك الإيجابي لمربع الموافقة قبولك الإلكتروني.
              تُحفظ الموافقة في حسابك للأكاديمية والدورة المعنيتين. يتطلب تغيير
              الوثيقة تجديد الموافقة.
          - en: Accepting these terms is separate from marketing consent and optional
              tutor-memory preferences. The Privacy Policy explains how platform
              information is handled. Contact support@perceptors.ai about either
              document.
            ar: قبول هذه الشروط منفصل عن الموافقة على التسويق وتفضيلات ذاكرة المدرّس
              الاختيارية. توضح سياسة الخصوصية كيفية التعامل مع معلومات المنصة.
              للاستفسار عن أي من الوثيقتين، تواصل عبر support@perceptors.ai.
