  faq:
    - q:
        en: Does the course give doses or protocols?
        ar-AE: هل تقدم الدورة جرعات أو بروتوكولات؟
      a:
        en: No. It teaches the evidence, the regulatory status and what each role can
          safely do next. Dosing and product sourcing are excluded by design.
        ar-AE: كلا. إنها تشرح الأدلة، والوضع التنظيمي، وما يمكن لكل دور مهني القيام به
          بأمان كخطوة تالية. وتُستثنى الجرعات وتوريد المنتجات عن قصد وبشكل
          أساسي.
    - q:
        en: Which countries does it cover?
        ar-AE: ما هي الدول التي تغطيها الدورة؟
      a:
        en: The United States, the United Kingdom, the European Union, Portugal, Brazil
          and the United Arab Emirates. Each statement names its country and
          date, and your own country comes first.
        ar-AE: الولايات المتحدة، والمملكة المتحدة، والاتحاد الأوروبي، والبرتغال،
          والبرازيل، والإمارات العربية المتحدة. تحدد كل عبارة بلدها وتاريخها،
          ويأتي بلدك أولاً.
    - q:
        en: Is there CME or CE credit?
        ar-AE: هل تمنح الدورة ساعات معتمدة للتعليم الطبي المستمر (CME) أو التعليم
          المستمر (CE)؟
      a:
        en: This is a Hormonaly Academy certificate of completion, with GCLS AI Academy
          as education partner. CME or CE credit is not offered at this time.
        ar-AE: النسخة العربية قيد المراجعة، ولم يُعتمد لها رصيد تعليم طبي أو مهني مستمر.
    - q:
        en: What do I get at the end?
        ar-AE: ما الذي سأحصل عليه عند إتمام الدورة؟
      a:
        en: Complete all seven modules and pass the final check with 80% or more to
          receive your Hormonaly Academy certificate of completion, including
          during October's free enrollment period. Each certificate has a public
          verification code.
        ar-AE: أكمل الوحدات السبع واجتز التقييم النهائي بنسبة 80% أو أكثر لتحصل على
          شهادة إتمام من أكاديمية Hormonaly، بما في ذلك خلال فترة التسجيل
          المجاني في أكتوبر. تحمل كل شهادة رمز تحقق متاحًا للعامة.
