    # Was ElevenLabs "Alice" (Xb7hH8MSUJpSbSDYk0k2).
    en: { provider: gemini-tts, voice_id: en-gb-tutor-1, model: gemini-3.8-flash-tts, style: "Warm, clear and precise clinical educator speaking to physicians. Natural, unhurried pace. Pronounce every medical and chemical term carefully and confidently.", name: "Gemini 3.8 TTS · en-gb-tutor-1 (the Skin course voice)" }
