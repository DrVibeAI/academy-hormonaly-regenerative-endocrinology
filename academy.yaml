        ar-AE: الولايات المتحدة، والمملكة المتحدة، والاتحاد الأوروبي، والبرتغال، والبرازيل، والإمارات العربية المتحدة.
          تحدد كل عبارة بلدها وتاريخها، ويأتي بلدك أولاً.
        ckb-IQ: ویلایەتە یەکگرتووەکان، شانشینی یەکگرتوو، یەکێتیی ئەورووپا، پورتوگال، بەڕازیل و ئیماراتی یەکگرتووی
          عەرەبی. هەر ڕاگەیەندراوێک ناوی وڵات و بەروارەکەی لەسەرە، و وڵاتەکەی خۆت لە پێشەوە دێت.
    - q:
