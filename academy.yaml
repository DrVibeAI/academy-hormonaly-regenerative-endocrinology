        البشرية، وما يقتصر على آلية العمل، وما تسمح به اللوائح في الولايات المتحدة، والمملكة المتحدة، والاتحاد
        الأوروبي، والبرتغال، والبرازيل، والإمارات العربية المتحدة."
      ckb-IQ: "ئەو هۆرمۆن و پێپتایدانەی نەخۆشەکانت پرسیاریان لەسەر دەکەن بۆ پێست، قژ و پیربوونی دەموچاو: ئەوەی لە
        مرۆڤدا سەلمێنراوە، ئەوەی تەنها میکانیزمە، و ئەوەی یاساکان ڕێگەی پێدەدەن لە ئەمریکا، بەریتانیا، یەکێتیی
        ئەورووپا، پورتوگال، بەڕازیل و ئیمارات."
