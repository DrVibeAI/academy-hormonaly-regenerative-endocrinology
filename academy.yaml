# Academy homepage (public, before sign-in) — Perceptors house design (design.md tier 0, perceptor-foundry docs/brand.md).
# The course list, numbers and audiences come from the catalog packages at build time; only the words below are written here.
# No accreditation or credit claim appears unless the package records it (runtime gate).
home:
  # Homepage copy (2026-09-25, Omar: the page should speak to the clinician with confidence, not explain the platform; less text,
  # clear headings, more pictures and numbers; skin aesthetics as a practice lever). Numbers come from the package, never from here.
  kicker: { en: "For clinicians" }
  headline: { en: "Skin peptides, answered with evidence." }
  lede: { en: "Your patients are already asking about hormones and peptides for their skin. Learn what the trials show, what is approved where you practise, and what to say next." }
  primaryAction: { en: "Enrol now" }
  secondaryAction: { en: "Watch the trailer" }
  heroImage: { src: "assets/hormones-peptides-skin/home/hero-skin.jpg" }
  heroVideo:
    src: "assets/hormones-peptides-skin/home/trailer.mp4"
    poster: "assets/hormones-peptides-skin/home/trailer-poster.jpg"
    label: { en: "Hormones and Peptides for Skin, the course trailer" }
    disclosure: { en: "Presented by a digital avatar (AI-generated presenter and voice)." }
  practice:
    kicker: { en: "In your practice" }
    title: { en: "Turn the questions into a service." }
    body: { en: "Copper peptides, collagen, tanning shots, growth-hormone boosters: most reach your clinic before any evidence does. Be the clinician with real answers, and build a skin service you can stand behind." }
    points:
      - { en: "Tell a randomized trial from a brochure" }
      - { en: "Spot the red flags on a certificate of analysis" }
      - { en: "Know what is approved in your country, and when to refer" }
    image: { src: "assets/hormones-peptides-skin/home/practice-skin.jpg", alt: { en: "Close-up of healthy, glowing skin" } }
  coursesTitle: { en: "The course" }
  coursesNote: { en: "More peptide courses are on the way." }
  glimpses:
    title: { en: "Learn by doing." }
    items:
      - { src: "assets/hormones-peptides-skin/home/inside-film.jpg", caption: { en: "A short film opens every module" } }
      - { src: "assets/hormones-peptides-skin/home/inside-trial.jpg", caption: { en: "Sort the evidence, one tap at a time" } }
      - { src: "assets/hormones-peptides-skin/home/inside-case.jpg", caption: { en: "Work through clinic cases" } }
      - { src: "assets/hormones-peptides-skin/home/inside-certificate.jpg", caption: { en: "Audit a certificate of analysis" } }
      - { src: "assets/hormones-peptides-skin/home/inside-country.jpg", caption: { en: "Your country's rules, dated" } }
  trust:
    title: { en: "Built on evidence. Reviewed by a physician." }
    items:
      - title: { en: "Every claim graded" }
        body: { en: "Each statement carries its evidence grade and its source." }
      - title: { en: "Your country first" }
        body: { en: "Regulatory status for six jurisdictions, labelled and dated." }
      - title: { en: "No dosing" }
        body: { en: "Evidence, regulation and next steps. Never doses or product sourcing." }
      - title: { en: "Ask the course" }
        body: { en: "A tutor answers from the course and its sources, and says when a question is outside them." }
  reviewers:
    - name: "Fady Hannah-Shmouni, MD FRCPC"
      role: { en: "Medical review · author of the Hormonaly pocket guides on aesthetic and regenerative endocrinology and on peptides" }
  faq:
    - q: { en: "Does the course give doses or protocols?" }
      a: { en: "No. It teaches the evidence, the regulatory status and what each role can safely do next. Dosing and product sourcing are excluded by design." }
    - q: { en: "Which countries does it cover?" }
      a: { en: "The United States, the United Kingdom, the European Union, Portugal, Brazil and the United Arab Emirates. Each statement names its country and date, and your own country comes first." }
    - q: { en: "Is there CME or CE credit?" }
      a: { en: "The course is accredited by GCLS, the Geneva College of Longevity Sciences. CME or CE credit is not offered at this time." }
    - q: { en: "What do I get at the end?" }
      a: { en: "Pass the final check with 80% or more to receive a certificate of completion for this GCLS-accredited course, with a public verification code." }
  certificate:
    title: { en: "Earn a GCLS-accredited certificate." }
    body: { en: "Finish the seven modules and pass the final check to receive your certificate of completion." }
  creators:
    kicker: { en: "For physician creators" }
    title: { en: "Launch your own course with Perceptors." }
    body: { en: "Physicians, educators and creators with something clinicians should learn: we turn your expertise into an evidence-checked course and academy like this one." }
    action:
      label: { en: "Talk to us" }
      href: "https://www.perceptors.ai/contact?prompt=I%20want%20to%20launch%20my%20own%20course%20with%20Perceptors#general-inquiries"
  ctaTitle: { en: "Start with Module 1 today." }
  disclaimer: { en: "Educational content for licensed clinicians. It does not replace clinical judgement, specialist input or formal guidelines." }

catalog:
  # The academy's first catalog entry is the course the runtime serves. The 2026-09-02 intake placeholder
  # (packages/aesthetic-regenerative-endocrinology.json, never authored) was removed 2026-09-24 so the catalog gate passes;
  # re-add it when that package exists.
  - course: packages/hormones-peptides-skin.json          # Hormones and Peptides for Skin
    audience: { en: "Physicians, nurse practitioners and physician associates, nurses and other licensed providers" }
    blurb: { en: "The hormones and peptides your patients ask about for skin, hair and the ageing face: what is shown in people, what is only mechanism, and what the rules allow in the US, the UK, the EU, Portugal, Brazil and the UAE." }
    status: draft
    series: regenerative-endocrinology
    order: 1
    # GCLS accreditation, relayed by Omar 2026-09-25: "they gave me verbal that they'll be accredited, but they'll send over the email
    # afterwards … mention that it is GCLS-accredited". The certificate stays academy-issued until the written confirmation and an
    # accreditation id arrive (package governance.accreditation), then it becomes GCLS-issued.
    accreditation: { body: "GCLS", name: "Geneva College of Longevity Sciences", status: accredited, logo: "/gcls/gcls-logo.png",
      basis: "Verbal confirmation from GCLS to Omar Saleem (product owner), 2026-09-25; written confirmation to follow" }
    entitlement: { type: paid, price: { amount: 199, currency: usd } }   # Omar 2026-09-25: "let's price it at $199" (Stripe Checkout; server/checkout.ts)
    certificate: { access: included }
    final: { by: "Omar Saleem (product owner)", date: "2026-09-25", revision: "academy-hormonaly-00009-6jl · 1.0.0-rc.4, walked end to end on hormonaly.perceptors.ai" }   # Omar: "it's final, go ahead"
    # 1.0.1 (2026-09-25): the androgen-secreting tumour figures removed from m2-p15/m2-p16 on Omar's instruction, Fady approving ("remove the numbers, fady's fine with that").
modules: { fieldbook: true, promptLab: false, webinars: false, blog: false, peers: false, achievements: false, studio: false }   # studio: operator demo view off for learners
# Learner experience (runtime clarity pass, 2026-09-25 — for Omar's review). The roles are the course's own audience levels
# (package metadata.variants.audienceLevel: prescriber · clinical-staff · advisor, the "How will you use this course?" moments):
# onboarding and Profile offer them, and the learner's choice pre-answers that question in modules 1 and 4. Labels follow the
# runtime's audience-level names; descriptions follow the course's own role options.
experience:
  defaultRole: prescriber
  roles:
    - id: prescriber
      label: { en: "Prescriber" }
      description: { en: "Physician, NP or PA" }
    - id: clinical-staff
      label: { en: "Clinical staff" }
      description: { en: "RN, aesthetic nurse or injector" }
    - id: advisor
      label: { en: "Advisor" }
      description: { en: "Pharmacist, ND or allied professional" }
  practicePrompts: false   # clinicians get the role notes; no "how this looks in my week" expanders or wellness tails from the Guide
  library:
    sourceNotes: false     # citation notes in this package are internal reading records (hashes, corpus paths, retrieval logs)
    evidencePolicy: { en: "Mechanism, human evidence, regulatory status and open questions are kept apart. The course gives no doses and no product sourcing." }
