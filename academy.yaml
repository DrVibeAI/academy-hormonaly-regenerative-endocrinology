  headline: { en: "Skin peptides, answered with evidence." }
  lede: { en: "Your patients are already asking about hormones and peptides for their skin. Learn what the trials show, what is approved where you practise, and what to say next." }
  primaryAction: { en: "Enrol now" }
  secondaryAction: { en: "Watch the trailer" }
  heroImage: { src: "assets/hormones-peptides-skin/home/hero-skin.jpg" }
  heroVideo:
    src: "assets/hormones-peptides-skin/home/trailer.mp4"
    poster: "assets/hormones-peptides-skin/home/trailer-poster.jpg"
    label: { en: "Hormones and Peptides for Skin, the course trailer" }
    disclosure: { en: "Presented by a digital avatar (AI-generated presenter and voice)." }
  practice:
    kicker: { en: "In your practice" }
    title: { en: "Turn the questions into a service." }
    body: { en: "Copper peptides, collagen, tanning shots, growth-hormone boosters: most reach your clinic before any evidence does. Be the clinician with real answers, and build a skin service you can stand behind." }
    points:
      - { en: "Tell a randomized trial from a brochure" }
      - { en: "Spot the red flags on a certificate of analysis" }
      - { en: "Know what is approved in your country, and when to refer" }
    image: { src: "assets/hormones-peptides-skin/home/practice-skin.jpg", alt: { en: "Close-up of healthy, glowing skin" } }
  coursesTitle: { en: "The course" }
  coursesNote: { en: "More peptide courses are on the way." }
  glimpses:
    title: { en: "Learn by doing." }
    items:
      - { src: "assets/hormones-peptides-skin/home/inside-film.jpg", caption: { en: "A short film opens every module" } }
      - { src: "assets/hormones-peptides-skin/home/inside-trial.jpg", caption: { en: "Sort the evidence, one tap at a time" } }
      - { src: "assets/hormones-peptides-skin/home/inside-case.jpg", caption: { en: "Work through clinic cases" } }
      - { src: "assets/hormones-peptides-skin/home/inside-certificate.jpg", caption: { en: "Audit a certificate of analysis" } }
      - { src: "assets/hormones-peptides-skin/home/inside-country.jpg", caption: { en: "Your country's rules, dated" } }
