    reviewNotice:
      en: Arabic translation draft — legal review pending.
      ar: مسودة ترجمة عربية — بانتظار المراجعة القانونية.
      ckb-IQ: ڕەشنووسی وەرگێڕانی سۆرانی — پێداچوونەوەی یاسایی لە چاوەڕوانیدایە.
  privacy:
    version: 2026-10-03-v1-ar-review-20261007
    updated: October 3, 2026
    title:
      en: Privacy Policy
      ar: سياسة الخصوصية
      ckb-IQ: سیاسەتی پاراستنی نهێنی
    sections:
      - title:
          en: Who to contact
          ar: جهة التواصل
          ckb-IQ: پەیوەندی بە کێوە بکەیت
        paragraphs:
          - en: Perceptors, a GCLS AI Lab platform, supports the academy provider identified on your course page. Contact
              support@perceptors.ai about privacy or account requests and identify the academy you use. Our
              contact location is Dubai, United Arab Emirates. Your academy or institution may provide an
              additional privacy notice for its own processing.
            ar: تدعم Perceptors، وهي منصة تابعة لـ GCLS AI Lab، الجهة المقدمة للأكاديمية المحددة في صفحة دورتك. لطلبات
              الخصوصية أو الحساب، تواصل عبر support@perceptors.ai وحدد الأكاديمية التي تستخدمها. موقع التواصل
              لدينا هو دبي، الإمارات العربية المتحدة. قد تقدم أكاديميتك أو مؤسستك إشعار خصوصية إضافياً يتعلق
              بمعالجتها الخاصة للبيانات.
            ckb-IQ: پلاتفۆرمی Perceptors، کە پلاتفۆرمێکی GCLS AI Labـە، پشتگیری لەو دابینکەرەی ئەکادیمیا دەکات کە لە پەڕەی
              خولەکەتدا دیاری کراوە. بۆ داواکارییەکانی پەیوەست بە نهێنی یان هەژمار، پەیوەندی بە
              support@perceptors.ai بکە و ئەو ئەکادیمیایە دەستنیشان بکە کە بەکاری دەهێنیت. شوێنی
              پەیوەندیکردنمان لە دوبەی، ئیماراتی یەکگرتووی عەرەبییە. ئەکادیمیا یان دامەزراوەکەت لەوانەیە
              ئاگادارییەکی زیاتری پاراستنی نهێنی بۆ پرۆسێسکردنی تایبەت بە خۆی دابین بکات.
      - title:
          en: Account, inquiry and learning information
          ar: معلومات الحساب والاستفسارات والتعلم
          ckb-IQ: زانیارییەکانی هەژمار، پرسیار و فێربوون
        paragraphs:
          - en: We process the information you provide in contact forms, including your name, email, organization and
              message, to respond to your inquiry. Learner accounts use identity and sign-in information,
              course enrollment, learning progress, assessment submissions and results to provide and
              administer learning.
            ar: نعالج المعلومات التي تقدمها في نماذج التواصل، ومنها اسمك وبريدك الإلكتروني ومؤسستك ورسالتك، للرد على
              استفسارك. تستخدم حسابات المتعلمين معلومات الهوية وتسجيل الدخول والتسجيل في الدورات والتقدم
              التعليمي وإجابات التقييمات ونتائجها لتوفير التعلم وإدارته.
            ckb-IQ: ئێمە ئەو زانیارییانەی لە فۆرمەکانی پەیوەندیدا دابینیان دەکەیت، لەوانەش ناو، ئیمەیڵ، ڕێکخراو و
              پەیامەکەت پرۆسێس دەکەین بۆ وەڵامدانەوەی پرسیارەکەت. هەژمارەکانی فێرخواز زانیاریی ناسنامە و
              چوونەژوورەوە، ناونووسینی خول، بەرەوپێشچوونی فێربوون، ناردنی هەڵسەنگاندنەکان و ئەنجامەکان
              بەکاردەهێنن بۆ دابینکردن و بەڕێوەبردنی فێربوون.
          - en: Where agreement is required, we retain the name you type, your account and academy/course identifiers,
              document version and snapshot, language and server-recorded acceptance time. This records what
              you agreed to.
            ar: عندما تكون الموافقة مطلوبة، نحتفظ بالاسم الذي تكتبه ومعرّفات حسابك والأكاديمية والدورة وإصدار الوثيقة
              ونسخة منها واللغة ووقت الموافقة المسجل على الخادم. يوثق ذلك ما وافقت عليه.
            ckb-IQ: لەو شوێنانەی ڕێککەوتن پێویستە، ئێمە ئەو ناوەی دەینووسیت، ناسێنەرەکانی هەژمار و ئەکادیمیا/خولەکەت،
              وەشانی بەڵگەنامە و وێنەی تۆمارکراوی، زمان و کاتی قبووڵکردنی تۆمارکراو لە سێرڤەر دەپارێزین. ئەمە
              ئەوە تۆمار دەکات کە لەسەری ڕێککەوتوویت.
      - title:
          en: AI-assisted learning
          ar: التعلم بمساعدة الذكاء الاصطناعي
          ckb-IQ: فێربوونی بەهێزکراو بە زیرەکیی دەستکرد
        paragraphs:
          - en: Questions, responses and learning context are processed to provide tutor features and feedback. Optional
              remembered preferences use the controls described in the course. Do not enter patient
              information, sensitive health details or confidential information. AI providers may process the
              information needed to deliver the requested feature.
            ar: تُعالج الأسئلة والإجابات وسياق التعلم لتوفير خصائص المدرّس والتغذية الراجعة. تُدار التفضيلات المحفوظة
              الاختيارية عبر الضوابط الموضحة في الدورة. لا تُدخل معلومات المرضى أو تفاصيل صحية حساسة أو
              معلومات سرية. قد يعالج مقدمو خدمات الذكاء الاصطناعي المعلومات اللازمة لتقديم الخاصية المطلوبة.
            ckb-IQ: پرسیارەکان، وەڵامەکان و چوارچێوەی فێربوون پرۆسێس دەکرێن بۆ دابینکردنی تایبەتمەندییەکانی ڕاهێنەر و
              پێدانی فیدباک. پەسەندکراوە لەبەرچاوگیراوە ئارەزوومەندانەکان ئەو کۆنترۆڵانە بەکاردەهێنن کە لە
              خولەکەدا ڕوونکراونەتەوە. زانیاریی نەخۆش، وردەکارییە هەستیارەکانی تەندروستی یان زانیاریی نهێنی
              تۆمار مەکە. دابینکەرانی زیرەکیی دەستکرد دەکرێت ئەو زانیارییانە پرۆسێس بکەن کە بۆ پێشکەشکردنی
              تایبەتمەندییە داواکراوەکە پێویستن.
      - title:
          en: Service providers and recipients
          ar: مقدمو الخدمات والجهات المتلقية
          ckb-IQ: دابینکەرانی خزمەتگوزاری و وەرگران
        paragraphs:
          - en: Providers of hosting, authentication, email, payment and AI services process information needed for those
              services. Academy administrators and authorized faculty may access learning records needed to
              administer the course, support learners and review assessments. Payment details are handled by
              the payment provider; the platform uses transaction and enrollment records to manage access.
            ar: يعالج مقدمو خدمات الاستضافة والمصادقة والبريد الإلكتروني والدفع والذكاء الاصطناعي المعلومات اللازمة لتلك
              الخدمات. قد يطلع مسؤولو الأكاديمية وأعضاء هيئة التدريس المصرح لهم على سجلات التعلم اللازمة
              لإدارة الدورة ودعم المتعلمين ومراجعة التقييمات. يتولى مقدم خدمة الدفع معالجة بيانات الدفع؛
              وتستخدم المنصة سجلات المعاملات والتسجيل لإدارة الوصول.
            ckb-IQ: دابینکەرانی خزمەتگوزارییەکانی میوانداریکردن، سەلماندنی ناسنامە، ئیمەیڵ، پارەدان و زیرەکیی دەستکرد ئەو
              زانیارییانە پرۆسێس دەکەن کە بۆ ئەو خزمەتگوزارییانە پێویستن. بەڕێوەبەرانی ئەکادیمیا و دەستەی
              مامۆستایانی ڕێپێدراو دەتوانن دەستیان بگات بە تۆمارەکانی فێربوون کە بۆ بەڕێوەبردنی خولەکە،
              پشتگیریکردنی فێرخوازان و پێداچوونەوەی هەڵسەنگاندنەکان پێویستن. وردەکارییەکانی پارەدان لەلایەن
              دابینکەری پارەدانەوە مامەڵەیان لەگەڵ دەکرێت؛ پلاتفۆرمەکە تۆمارەکانی مامەڵە داراییەکان و
              ناونووسین بەکاردەهێنێت بۆ بەڕێوەبردنی دەستپێڕاگەیشتن.
          - en: Public certificate verification can disclose the learner name, course, issuer, date and certificate status
              to someone with the verification link or code. Avoid sharing that link if you do not want to
              make those details available.
            ar: قد يكشف التحقق العام من الشهادات اسم المتعلم والدورة والجهة المُصدرة والتاريخ وحالة الشهادة لمن يملك رابط
              التحقق أو رمزه. تجنب مشاركة الرابط إذا كنت لا ترغب في إتاحة تلك التفاصيل.
            ckb-IQ: پشتڕاستکردنەوەی گشتیی بڕوانامە دەتوانێت ناوی فێرخواز، خول، لایەنی دەرکەر، بەروار و دۆخی بڕوانامە بۆ
              هەر کەسێک کە بەستەر یان کۆدی پشتڕاستکردنەوەی هەیە ئاشکرا بکات. ئەگەر ناتەوێت ئەو وردەکارییانە
              بەردەست بن، لە هاوبەشکردنی ئەو بەستەرە بەدوور بە.
      - title:
          en: Storage, international processing and security
          ar: التخزين والمعالجة الدولية والأمان
          ckb-IQ: هەڵگرتن، پرۆسێسکردنی نێودەوڵەتی و پاراستن
        paragraphs:
          - en: Services may process information in different countries depending on the academy’s hosting and provider
              arrangements. Institutional hosting and data requirements are set with the relevant provider; do
              not assume a particular country of storage from a contact address.
            ar: قد تعالج الخدمات المعلومات في دول مختلفة بحسب ترتيبات استضافة الأكاديمية ومقدمي خدماتها. تُحدد متطلبات
              الاستضافة والبيانات المؤسسية مع مقدم الخدمة المعني؛ فلا تفترض دولة معينة للتخزين استناداً إلى
              عنوان التواصل.
            ckb-IQ: لەوانەیە خزمەتگوزارییەکان لە وڵاتانی جیاواز زانیارییەکان پرۆسێس بکەن، بەپێی میوانداریکردن و
              ڕێکخستنەکانی دابینکەری ئەکادیمیاکە. پێداویستییەکانی میوانداریکردنی دامەزراوەیی و داتا لەگەڵ
              دابینکەری پەیوەندیدار دیاری دەکرێن؛ لەسەر بنەمای ناونیشانی پەیوەندی گریمانەی وڵاتێکی دیاریکراو
              بۆ هەڵگرتن مەکە.
          - en: Access controls and operational safeguards support protection of information. No service can guarantee
              absolute security. We retain information as needed to provide learning, document certificates
              and agreements, resolve issues and meet applicable obligations. Retention depends on record type
              and academy arrangements.
            ar: تسهم ضوابط الوصول والتدابير التشغيلية في حماية المعلومات. لا تستطيع أي خدمة ضمان الأمان المطلق. نحتفظ
              بالمعلومات بقدر الحاجة لتوفير التعلم وتوثيق الشهادات والاتفاقات ومعالجة المشكلات والوفاء
              بالالتزامات المعمول بها. تعتمد مدة الاحتفاظ على نوع السجل وترتيبات الأكاديمية.
            ckb-IQ: کۆنتڕۆڵەکانی دەستپێڕاگەیشتن و ڕێوشوێنە خۆپارێزییە کارگێڕییەکان پاڵپشتی پاراستنی زانیاری دەکەن. هیچ
              خزمەتگوزارییەک ناتوانێت پاراستنی تەواوەتی مسۆگەر بکات. ئێمە زانیارییەکان بەپێی پێویست دەهێڵینەوە
              بۆ دابینکردنی فێربوون، بەڵگەدارکردنی بڕوانامە و ڕێککەوتنەکان، چارەسەرکردنی کێشەکان و جێبەجێکردنی
              پابەندییە کارپێکراوەکان. مانەوەی داتا بەندە بە جۆری تۆمار و ڕێکخستنەکانی ئەکادیمیا.
      - title:
          en: Cookies and device storage
          ar: ملفات تعريف الارتباط وتخزين الجهاز
          ckb-IQ: کووکییەکان و بیرگەی ئامێر
        paragraphs:
          - en: Sign-in and learning features use browser storage to keep your session, language and learning state. The
              public website may collect usage events through its configured analytics service. Browser
              controls can clear or restrict local storage; doing so can affect sign-in and unsynchronized
              learning progress.
            ar: تستخدم خصائص تسجيل الدخول والتعلم تخزين المتصفح للاحتفاظ بجلستك ولغتك وحالة تعلمك. قد يجمع الموقع العام
              أحداث الاستخدام عبر خدمة التحليلات المعدّة له. تتيح إعدادات المتصفح مسح التخزين المحلي أو
              تقييده؛ وقد يؤثر ذلك في تسجيل الدخول والتقدم التعليمي غير المتزامن.
            ckb-IQ: تایبەتمەندییەکانی چوونەژوورەوە و فێربوون بیرگەی وێبگەڕ بەکاردەهێنن بۆ پاراستنی دانیشتن، زمان و دۆخی
              فێربوونت. ماڵپەڕە گشتییەکە لەوانەیە ڕووداوەکانی بەکارهێنان لە ڕێگەی خزمەتگوزاریی شیکاریی
              سازێنراوی خۆیەوە کۆبکاتەوە. کۆنتڕۆڵەکانی وێبگەڕ دەتوانن بیرگەی ناوخۆیی بسڕنەوە یان سنوورداری
              بکەن؛ ئەنجامدانی ئەمە دەکرێت کاریگەری لەسەر چوونەژوورەوە و پێشکەوتنی هاوکاتنەکراوی فێربوون دروست
              بکات.
      - title:
          en: Your choices and requests
          ar: خياراتك وطلباتك
          ckb-IQ: هەڵبژاردەکان و داواکارییەکانت
        paragraphs:
          - en: You can use available account and tutor controls and contact support to request access, correction or
              deletion of personal information. Rights and exceptions depend on applicable law and the role of
              your academy or institution. We may need to verify your identity before acting. Do not send
              identity documents or sensitive records unless requested through an appropriate process.
            ar: يمكنك استخدام ضوابط الحساب والمدرّس المتاحة والتواصل مع الدعم لطلب الوصول إلى معلوماتك الشخصية أو تصحيحها
              أو حذفها. تعتمد الحقوق والاستثناءات على القانون المعمول به ودور أكاديميتك أو مؤسستك. قد نحتاج
              إلى التحقق من هويتك قبل تنفيذ الطلب. لا ترسل وثائق هوية أو سجلات حساسة إلا إذا طُلبت منك ضمن
              إجراء مناسب.
            ckb-IQ: دەتوانیت کۆنتڕۆڵە بەردەستەکانی هەژمار و مامۆستا بەکاربهێنیت و پەیوەندی بە پاڵپشتییەوە بکەیت بۆ
              داواکردنی دەستپێڕاگەیشتن، راستکردنەوە یان سڕینەوەی زانیارییە کەسییەکان. مافەکان و لێخۆشبوونەکان
              بەندە بە یاسای کارپێکراو و ڕۆڵی ئەکادیمیا یان دامەزراوەکەت. لەوانەیە پێویست بکات ناسنامەکەت
              پشتڕاست بکەینەوە پێش ئەوەی هەنگاو بنێین. بەڵگەنامەی ناسنامە یان تۆماری هەستیار مەنێرە مەگەر لە
              ڕێگەی پرۆسەیەکی گونجاوەوە داوات لێکرابێت.
          - en: Terms acceptance does not sign you up for marketing. Optional communications and optional tutor
              preferences are managed separately.
            ar: لا يؤدي قبول الشروط إلى اشتراكك في التسويق. تُدار المراسلات الاختيارية وتفضيلات المدرّس الاختيارية بصورة
              منفصلة.
            ckb-IQ: قبووڵکردنی مەرجەکان ناوت لە بازاڕگەریدا تۆمار ناکات. پەیوەندییە ئارەزوومەندانەکان و هەڵبژاردە
              ئارەزوومەندانەکانی مامۆستا بە جیا بەڕێوەدەبرێن.
      - title:
          en: Policy updates
          ar: تحديثات السياسة
          ckb-IQ: نوێکردنەوەکانی سیاسەت
        paragraphs:
          - en: The displayed version and date identify this policy. Material changes are reflected in an updated notice.
              Where the learner agreement is presented again, it identifies the revised documents.
            ar: يحدد الإصدار والتاريخ المعروضان هذه السياسة. تنعكس التغييرات الجوهرية في إشعار محدّث. وعند عرض اتفاق
              المتعلم مجدداً، فإنه يحدد الوثائق المعدلة.
            ckb-IQ: وەشان و بەرواری پیشاندراو ئەم سیاسەتە دەستنیشان دەکەن. گۆڕانکارییە گرنگەکان لە ئاگادارییەکی نوێکراوەدا
              ڕەنگدەدەنەوە. لەو شوێنانەی کە ڕێککەوتنی فێرخواز دووبارە دەخرێتەڕوو، بەڵگەنامە
              پێداچوونەوەپێکراوەکان دەستنیشان دەکات.
