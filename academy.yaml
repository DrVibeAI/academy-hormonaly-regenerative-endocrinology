today:
  lines:
    label:
      en: Line of the day
      ar-AE: عبارة اليوم
    items:
      - from: m1-p01
        text:
          en: The skin makes its own hormones.
          ar-AE: يُنتج الجلد هرموناته الخاصة.
        detail:
          en: Skin senses hormones from the blood, makes several of its own, and ages in
            ways that change both.
          ar-AE: يستشعر الجلد الهرمونات من الدم، ويُصنّع العديد منها بنفسه، ويشيخ بطرق
            تُغيّر كليهما.
        image:
          src: /assets/hormones-peptides-skin/ui/skin-texture.jpg
          alt:
            en: Editorial close-up of natural skin texture
            ar: صورة توضيحية مقربة لملمس الجلد الطبيعي
      - from: m2-p02
        text:
          en: The skin regenerates its own cortisol.
          ar-AE: يُعيد الجلد تجديد الكورتيزول الخاص به.
        detail:
          en: Keratinocytes and dermal fibroblasts also carry 11β-HSD1, the enzyme that
            turns inactive cortisone back into active cortisol inside the cell.
          ar-AE: تحمل الخلايا الكيراتينية والخلايا الليفية في الأدمة أيضاً إنزيم 11β-HSD1،
            وهو الإنزيم الذي يُحوّل الكورتيزون غير النشط مرة أخرى إلى كورتيزول
            نشط داخل الخلية.
        image:
          src: assets/hormones-peptides-skin/today/m2-p02.jpg
          alt:
            en: Sunlight falling across the skin of a bare shoulder
            ar-AE: ضوء الشمس يسقط على جلد كتف عارٍ
          prompt: Late sunlight falling across the skin of a bare shoulder blade, a soft
            glow over fine texture, the light fading into a warm gradient.
      - from: m3-p05
        text:
          en: Fifteen years on the same collagen.
          ar-AE: خمسة عشر عاماً على الكولاجين ذاته.
        detail:
          en: Human skin collagen turns over slowly; tissue analysis puts its half-life at
            about 15 years.
          ar-AE: يتجدد كولاجين جلد الإنسان ببطء؛ ويُقدّر التحليل النسيجي عمر النصف له بنحو
            15 عاماً.
        image:
          src: assets/hormones-peptides-skin/today/m3-p05.jpg
          alt:
            en: Close-up of softly creased linen threads
            ar-AE: لقطة مقربة لخيوط كتان متجعدة بنعومة
          prompt: "Close-up of finely woven natural linen threads, softly creased and
            slightly worn, in warm side light: long-lived fibres."
      - from: m4-p01
        text:
          en: The peptide your patient already bought.
          ar-AE: الببتيد الذي اشتراه مريضك بالفعل.
        detail:
          en: Most skin peptides reach your clinic before any evidence does.
          ar-AE: تصل معظم ببتيدات الجلد إلى عيادتك قبل وصول أي أدلة.
        image:
          src: assets/hormones-peptides-skin/today/m4-p01.jpg
          alt:
            en: A small unlabelled serum bottle on a stone shelf
            ar-AE: زجاجة مصل صغيرة بلا ملصق تعريفي على رف حجري
          prompt: A small clear glass dropper bottle of serum with no label, standing on a
            travertine shelf beside a folded cotton towel, soft window light.
      - from: m5-p02
        text:
          en: A follicle that runs its own hormones.
          ar-AE: جريب يُدير هرموناته بنفسه.
        detail:
          en: Human scalp hair follicles kept alive in the laboratory answer
            corticotropin-releasing hormone by making ACTH and α-MSH and
            secreting cortisol, with a feedback loop like the adrenal axis.
          ar-AE: تستجيب جريبات شعر فروة رأس الإنسان المحفوظة حية في المختبر للهرمون المطلق
            لموجهة القشرة عن طريق تصنيع ACTH وα-MSH وإفراز الكورتيزول، مع وجود
            حلقة تغذية راجعة مماثلة للمحور الكظري.
        image:
          src: assets/hormones-peptides-skin/today/m5-p02.jpg
          alt:
            en: Backlit fine hairs on the skin of an arm
            ar-AE: شعيرات دقيقة مضاءة من الخلف على جلد الذراع
          prompt: Fine hairs on the skin of a forearm, backlit so each hair glows like a
            filament against a soft cream background.
      - from: m6-p02
        text:
          en: Two hormones, two layers of skin.
          ar-AE: هرمونان، وطبقتان من الجلد.
        detail:
          en: Growth hormone acts mostly in the dermis. IGF-1, made locally by fibroblasts
            and melanocytes, reaches keratinocytes through the IGF-1 receptor
            and makes them divide.
          ar-AE: يعمل هرمون النمو بشكل أساسي في الأدمة. بينما يصل IGF-1، الذي يُصنّع
            محلياً بواسطة الخلايا الليفية والخلايا الصباغية، إلى الخلايا
            الكيراتينية عبر مستقبل IGF-1 ويحثها على الانقسام.
        image:
          src: assets/hormones-peptides-skin/today/m6-p02.jpg
          alt:
            en: Two layered sheets of translucent silk, backlit
            ar-AE: طبقتان من الحرير شبه الشفاف، مضاءتان من الخلف
          prompt: Two sheets of translucent silk in cream and blush, one laid over the
            other and backlit so both layers glow.
      - from: m7-p13
        text:
          en: Research use only is a label, and never a route.
          ar-AE: عبارة «للاستخدام البحثي فقط» هي ملصق تصنيفي وليست مساراً للإعطاء على
            الإطلاق.
        image:
          src: /assets/hormones-peptides-skin/ui/evidence-desk.jpg
          alt:
            en: A quiet workspace for reviewing evidence
            ar: مساحة عمل هادئة لمراجعة الأدلة
      - from: m1-p13
        text:
          en: Cells that stop dividing and keep talking.
          ar-AE: خلايا تتوقف عن الانقسام وتستمر في التواصل.
        detail:
          en: "A senescent cell has stopped dividing for good but stays metabolically
            active, releasing cytokines, matrix-degrading enzymes and growth
            factors: the senescence-associated secretory phenotype, or SASP."
          ar-AE: "تتوقف الخلية الهرمة عن الانقسام نهائياً لكنها تظل نشطة استقلابياً، حيث
            تفرز السيتوكينات والإنزيمات المُحللة للمطرس وعوامل النمو: وهو ما
            يُعرف بالنمط الظاهري الإفرازي المرتبط بالشيخوخة الخلوية (SASP)."
        image:
          src: assets/hormones-peptides-skin/today/m1-p13.jpg
          alt:
            en: Soft luminous spheres clustered like cells
            ar-AE: كريات مضيئة ناعمة متجمعة كالخلايا
          prompt: Dreamlike macro of soft luminous translucent spheres clustered like
            cells, lit in amber with faint violet shadows, like a painterly
            micrograph.
      - from: m2-p01
        text:
          en: The face that might be a diagnosis.
          ar-AE: الوجه الذي قد يمثل تشخيصاً.
        detail:
          en: Most skin changes you see are ageing or lifestyle. A few are the first
            visible sign of endocrine disease.
          ar-AE: معظم التغيرات الجلدية التي تراها تعود إلى التقدم في العمر أو نمط الحياة.
            وقليل منها هو أول علامة مرئية لمرض في الغدد الصماء.
        image:
          src: assets/hormones-peptides-skin/today/m2-p01.jpg
          alt:
            en: A round mirror in a quiet clinic room
            ar-AE: مرآة مستديرة في غرفة عيادة هادئة
          prompt: A round mirror on a pale plaster wall reflecting only soft daylight and
            a window, a calm and empty examination room.
      - from: m3-p04
        text:
          en: Sugar that sticks to collagen.
          ar-AE: السكر الذي يلتصق بالكولاجين.
        detail:
          en: Glycation is a slow, non-enzymatic reaction. Reducing sugars attach to
            protein amino groups, rearrange into Amadori products and end as
            advanced glycation end products, or AGEs.
          ar-AE: التسكير تفاعل بطيء وغير إنزيمي؛ حيث ترتبط السكريات المختزلة بالمجموعات
            الأمينية البروتينية، وتُعيد ترتيب نفسها لتشكل نواتج أمادوري، وتنتهي
            بإنتاج نواتج التسكير المتقدمة، أو AGEs.
        image:
          src: assets/hormones-peptides-skin/today/m3-p04.jpg
          alt:
            en: Sugar crystals scattered on cream silk
            ar-AE: بلورات سكر متناثرة على حرير كريمي اللون
          prompt: Sugar crystals scattered over smooth cream silk, macro, warm side light
            making the crystals sparkle.
      - from: m6-p05
        text:
          en: Deficiency is a diagnosis. Decline is ageing.
          ar-AE: العوز تشخيص. والتراجع شيخوخة.
        image:
          src: assets/hormones-peptides-skin/today/m6-p05.jpg
          alt:
            en: Late light moving across a plaster wall
            ar-AE: ضوء الأصيل يتحرك عبر جدار جصي
          prompt: The shadow of a window frame falling across a warm plaster wall in
            late-afternoon light, a quiet sense of time passing.
      - from: m1-p06
        text:
          en: Read the skin before the serum.
          ar-AE: اقرأ الجلد قبل المصل.
        detail:
          en: The Aesthetic & Regenerative Endocrinology guide treats the aesthetic exam
            as a systemic screen.
          ar-AE: يتعامل دليل طب الغدد الصماء التجميلي والتجديدي مع الفحص التجميلي بوصفه
            مسحاً جهازياً.
        image:
          src: assets/hormones-peptides-skin/today/m1-p06.jpg
          alt:
            en: A hand holding a magnifying loupe in window light
            ar-AE: يد تمسك بعدسة مكبرة في ضوء النافذة
          prompt: A hand in a clean white sleeve holding a small magnifying loupe in soft
            window light; a serum bottle stands out of focus in the background.
      - from: m2-p13
        text:
          en: Some syndromes show on the skin first.
          ar-AE: تظهر بعض المتلازمات على الجلد أولاً.
        detail:
          en: A handful of inherited endocrine syndromes appear on the skin before the
            glands declare themselves.
          ar-AE: يظهر عدد قليل من متلازمات الغدد الصماء الوراثية على الجلد قبل أن تُفصح
            الغدد عن عللها.
        image:
          src: assets/hormones-peptides-skin/today/m2-p13.jpg
          alt:
            en: Raking light across the skin of an upper arm
            ar-AE: ضوء مائل ينساب عبر جلد أعلى الذراع
          prompt: Raking early light across the skin of an upper arm, revealing its fine
            topography like a landscape at dawn.
      - from: m3-p02
        text:
          en: The skin keeps its own fat.
          ar-AE: يحتفظ الجلد بدهونه الخاصة.
        detail:
          en: Beneath the dermis lies subcutaneous fat. Within the reticular dermis itself
            sits a thinner layer, dermal white adipose tissue.
          ar-AE: تحت الأدمة تقع الدهون تحت الجلد. وداخل الأدمة الشبكية نفسها تستقر طبقة
            أرق، وهي النسيج الشحمي الأبيض الأدمي.
        image:
          src: assets/hormones-peptides-skin/today/m3-p02.jpg
          alt:
            en: Golden droplets suspended in clear water
            ar-AE: قطرات ذهبية معلقة في ماء صافٍ
          prompt: Abstract macro of golden oil droplets suspended in clear water, soft
            warm light, gentle bokeh.
      - from: m2-p06
        text:
          en: Reassure the many, refer the few.
          ar-AE: طمئن الغالبية، وأحل القلة.
        detail:
          en: "When a patient asks about 'cortisol face', start with the drug history:
            steroid creams, skin-lighteners, herbal tonics and injections."
          ar-AE: "عندما يسأل مريض عن «وجه الكورتيزول»، ابدأ بالتاريخ الدوائي: كريمات
            الستيرويد، ومفتحات البشرة، والمقويات العشبية، والحقن."
        image:
          src: assets/hormones-peptides-skin/today/m2-p06.jpg
          alt:
            en: A quiet clinic corridor with warm light from a door
            ar-AE: ممر عيادة هادئ مع ضوء دافئ ينبعث من باب
          prompt: A quiet clinic corridor at dusk, one door ajar with warm light spilling
            across a pale floor.
